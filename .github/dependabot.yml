# BOTS DISABLED 2026-08-14 per owner ruling (taly_planner#50): open-pull-requests-limit 0
# stops NEW Dependabot PRs; existing 47 bot PRs stay open pending classification.
version: 2
updates:
  # Frontend dependencies
  - package-ecosystem: "npm"
    directory: "/apps/dashboard/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "deps"
      include: "scope"

  # Backend dependencies
  - package-ecosystem: "npm"
    directory: "/backend/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "deps"
      include: "scope"

  # Serverless dependencies
  - package-ecosystem: "npm"
    directory: "/serverless/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "deps"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/.github/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "ci"
      include: "scope"

